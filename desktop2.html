<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN SURFACE V2</title>
    <style>
        :root {
            --bg-dark: #020617;
            --panel-bg: #0f172a;
            --border-color: #334155;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --menubar-h: 28px;
            --taskbar-h: 26px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }

        #menubar {
            height: var(--menubar-h);
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center;
            padding: 0 6px; gap: 2px; z-index: 5000; position: relative;
        }
        .menu-root { position: relative; }
        .menu-btn {
            background: transparent; color: var(--text-main);
            border: 1px solid transparent; font-size: 11px;
            padding: 2px 8px; cursor: pointer; border-radius: 2px;
        }
        .menu-btn:hover, .menu-root.open .menu-btn { background: #1e293b; border-color: var(--border-color); color: var(--accent-cyan); }
        .menu-drop {
            display: none; position: absolute; top: 100%; left: 0;
            min-width: 200px; background: var(--panel-bg);
            border: 1px solid var(--border-color); z-index: 6000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .menu-root.open .menu-drop { display: block; }
        .menu-item {
            display: block; width: 100%; text-align: left;
            background: none; border: none; color: var(--text-main);
            font-size: 11px; padding: 5px 10px; cursor: pointer;
        }
        .menu-item:hover { background: #1e293b; color: var(--accent-cyan); }
        .menu-item.disabled { color: #475569; cursor: default; }
        .menu-item.disabled:hover { background: none; color: #475569; }
        .menu-sep { height: 1px; background: var(--border-color); margin: 3px 0; }
        .menu-spacer { flex: 1; }
        .menu-status { font-size: 10px; color: var(--text-muted); padding-right: 8px; display: flex; align-items: center; gap: 8px; }
        #tick-led {
            width: 8px; height: 8px; border-radius: 50%;
            background: #14532d; display: inline-block;
        }
        #tick-led.on { background: #4ade80; box-shadow: 0 0 6px #4ade80; }

        #desktop {
            position: relative;
            width: 100%;
            height: calc(100% - var(--menubar-h) - var(--taskbar-h));
            overflow: hidden;
            background: #000;
        }
        #wallpaper { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        #wall-term {
            position: absolute; inset: 0;
            font-size: 11px; line-height: 1.15; color: #14532d;
            white-space: pre; padding: 8px; opacity: 0.45;
        }
        #wall-img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; display: none; opacity: 0.35;
        }
        #ascii-wallpaper {
            position: absolute; inset: 0; display: none;
            font-size: 8px; line-height: 0.85; color: #164e63;
            white-space: pre; overflow: hidden; padding: 4px;
        }

        .win {
            position: absolute;
            min-width: 240px; min-height: 160px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            display: flex; flex-direction: column;
            z-index: 10;
        }
        .win.active { border-color: var(--accent-cyan); }
        .win.minimized { display: none; }
        .win-title {
            height: 22px; background: #1e293b;
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 4px 0 8px; cursor: move; font-size: 11px; color: var(--accent-cyan);
            flex-shrink: 0;
        }
        .win-btns { display: flex; gap: 2px; }
        .win-btns button {
            width: 16px; height: 16px; font-size: 10px; line-height: 14px;
            background: #0f172a; color: var(--text-main);
            border: 1px solid var(--border-color); cursor: pointer; padding: 0;
        }
        .win-btns button:hover { background: var(--accent-cyan); color: #000; }
        .win-btns button.close:hover { background: #ef4444; color: #fff; }
        .win-body { flex: 1; overflow: auto; position: relative; min-height: 0; }
        .win-resize {
            position: absolute; right: 0; bottom: 0; width: 12px; height: 12px;
            cursor: nwse-resize; background:
                linear-gradient(135deg, transparent 50%, var(--border-color) 50%);
            z-index: 2;
        }

        #taskbar {
            height: var(--taskbar-h);
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 4px; padding: 0 6px;
        }
        .task-btn {
            font-size: 10px; background: #1e293b; color: var(--text-main);
            border: 1px solid var(--border-color); padding: 2px 8px; cursor: pointer;
        }
        .task-btn.active { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .task-btn.hidden-win { opacity: 0.5; }

        .fm { display: flex; height: calc(100% - 24px); font-size: 11px; }
        .fm-tree {
            width: 140px; border-right: 1px solid var(--border-color);
            padding: 6px; color: var(--text-muted); overflow: auto;
        }
        .fm-tree div { padding: 2px 4px; cursor: pointer; }
        .fm-tree div:hover, .fm-tree div.sel { color: var(--accent-cyan); background: #1e293b; }
        .fm-list { flex: 1; padding: 6px; overflow: auto; }
        .fm-row {
            display: grid; grid-template-columns: 18px 1fr 70px 80px;
            gap: 6px; padding: 2px 4px; cursor: pointer;
        }
        .fm-row:hover { background: #1e293b; }
        .fm-row.head { color: var(--text-muted); border-bottom: 1px solid var(--border-color); margin-bottom: 4px; cursor: default; }
        .fm-toolbar { display: flex; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--border-color); }
        .btn-mini {
            background: #1e293b; color: var(--text-main);
            border: 1px solid var(--border-color); font-size: 10px;
            padding: 2px 6px; cursor: pointer;
        }
        .btn-mini:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-mini.active { background: var(--accent-emerald); color: #000; }
        .btn-mini.danger { border-color: #7f1d1d; color: #fca5a5; }

        .launch-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
            gap: 8px; padding: 10px;
        }
        .launch-tile {
            border: 1px solid var(--border-color); background: #020617;
            padding: 10px 6px; text-align: center; cursor: pointer; font-size: 10px;
        }
        .launch-tile:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .launch-ico { font-size: 18px; margin-bottom: 4px; }

        .term-shell { display: flex; flex-direction: column; height: 100%; }
        .term-bar {
            display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
            padding: 4px; border-bottom: 1px solid var(--border-color);
            background: #020617; font-size: 10px;
        }
        .term-bar input[type=text] {
            background: #000; border: 1px solid var(--border-color);
            color: var(--accent-cyan); font-family: inherit; font-size: 11px;
            padding: 2px 4px; width: 140px;
        }
        .term-bar input.port { width: 56px; }
        .term {
            flex: 1; background: #000; color: #4ade80;
            font-size: 12px; line-height: 1.3; padding: 6px;
            overflow: auto; white-space: pre-wrap; user-select: text;
        }
        .term-in {
            display: flex; border-top: 1px solid #14532d; background: #020617;
        }
        .term-in span { color: #22c55e; padding: 4px 6px; font-size: 12px; }
        .term-in input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #86efac; font-family: inherit; font-size: 12px; padding: 4px 0;
        }
        .led { width: 8px; height: 8px; border-radius: 50%; background: #334155; display: inline-block; }
        .led.ok { background: #4ade80; }
        .led.bad { background: #ef4444; }
        .led.wait { background: #f59e0b; }

        .probe-table { width: 100%; border-collapse: collapse; font-size: 10px; }
        .probe-table th, .probe-table td {
            border-bottom: 1px solid #1e293b; padding: 3px 6px; text-align: left;
        }
        .probe-table th { color: var(--text-muted); }

        .dbg { height: 100%; overflow: auto; background: #000; font-size: 11px; padding: 6px; white-space: pre; color: #94a3b8; }
        .dbg .l0 { color: #f59e0b; }
        .dbg .l1 { color: #22c55e; }
        .dbg .l2 { color: #64748b; }

        .clip-list { padding: 6px; font-size: 11px; }
        .clip-item {
            border: 1px solid var(--border-color); margin-bottom: 6px; padding: 6px;
            background: #020617; cursor: pointer;
        }
        .clip-item:hover { border-color: var(--accent-cyan); }
        .clip-item img { max-width: 100%; max-height: 80px; display: block; margin-top: 4px; }
        .clip-meta { color: var(--text-muted); font-size: 10px; }

        .lab-wrap { display: flex; height: 100%; }
        .lab-side {
            width: 200px; border-right: 1px solid var(--border-color);
            padding: 6px; display: flex; flex-direction: column; gap: 6px; overflow: auto;
        }
        .ctrl-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 4px; background: rgba(0,0,0,0.3); padding: 2px 4px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .ctrl-label { color: var(--text-muted); font-size: 10px; }
        .stepper { display: flex; align-items: center; background: #020617; border: 1px solid var(--border-color); }
        .stepper button {
            background: #1e293b; color: #fff; border: none; width: 16px; height: 16px;
            font-size: 10px; cursor: pointer;
        }
        .stepper input {
            width: 32px; background: transparent; border: none;
            color: var(--accent-cyan); text-align: center; font-size: 10px;
        }
        #ascii-output {
            flex: 1; background: #000; color: #38bdf8;
            font-size: 8px; line-height: 0.85; white-space: pre;
            overflow: hidden; padding: 4px;
        }

        .wall-card { padding: 8px; font-size: 11px; color: var(--text-muted); line-height: 1.4; }
        .wall-card b { color: var(--accent-amber); }
        .wall-card code { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <div id="menubar">
        <div class="menu-root">
            <button class="menu-btn">File</button>
            <div class="menu-drop">
                <button class="menu-item" data-act="new-term">New Terminal</button>
                <button class="menu-item" data-act="open-fm">Open File Manager</button>
                <button class="menu-item" data-act="open-launch">Open Launcher</button>
                <div class="menu-sep"></div>
                <button class="menu-item disabled">Open… (stub)</button>
                <button class="menu-item" data-act="reset">Reset Layout</button>
            </div>
        </div>
        <div class="menu-root">
            <button class="menu-btn">Edit</button>
            <div class="menu-drop">
                <button class="menu-item" data-act="open-clip">Clipboard Bank</button>
                <button class="menu-item disabled">Cut / Copy (OS)</button>
            </div>
        </div>
        <div class="menu-root">
            <button class="menu-btn">View</button>
            <div class="menu-drop">
                <button class="menu-item" data-act="wall-term">Wallpaper: Scroll Terminal</button>
                <button class="menu-item" data-act="wall-ascii">Wallpaper: ASCII Test</button>
                <button class="menu-item" data-act="wall-solid">Wallpaper: Solid</button>
                <button class="menu-item" data-act="wall-img">Wallpaper: Picture</button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-act="open-lab">BitMatrix Lab</button>
                <button class="menu-item" data-act="open-dbg">Debug / Telemetry</button>
                <button class="menu-item" data-act="open-walls">HTML Walls</button>
                <button class="menu-item" data-act="open-map">Connect Map</button>
            </div>
        </div>
        <div class="menu-root">
            <button class="menu-btn">Options</button>
            <div class="menu-drop">
                <button class="menu-item" data-act="mode-desktop">Mode: Desktop</button>
                <button class="menu-item" data-act="mode-test">Mode: Test (Lab)</button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-act="verb-0">Verbose 0 (high only)</button>
                <button class="menu-item" data-act="verb-1">Verbose 1 (ticks) *</button>
                <button class="menu-item" data-act="verb-2">Verbose 2 (all)</button>
            </div>
        </div>
        <div class="menu-root">
            <button class="menu-btn">Help</button>
            <div class="menu-drop">
                <button class="menu-item" data-act="about">About Surface</button>
                <button class="menu-item" data-act="open-walls">HTML walls</button>
            </div>
        </div>
        <div class="menu-spacer"></div>
        <span class="menu-status">
            <span id="tick-led"></span>
            <span id="tick-n">t0</span>
            <span>V2</span>
            <span id="clock"></span>
        </span>
    </div>

    <div id="desktop">
        <div id="wallpaper">
            <pre id="wall-term"></pre>
            <pre id="ascii-wallpaper"></pre>
            <img id="wall-img" alt="">
        </div>
    </div>

    <div id="taskbar">
        <button class="btn-mini" onclick="launch('launcher')">◆ Launch</button>
        <button class="btn-mini" onclick="launch('fm')">▤ Files</button>
        <button class="btn-mini" onclick="launch('term')">▶ Term</button>
        <button class="btn-mini" onclick="launch('dbg')">☉ Debug</button>
        <button class="btn-mini" onclick="launch('clip')">⎘ Clip</button>
        <span style="flex:1"></span>
        <span id="task-wins" style="display:flex;gap:4px;"></span>
    </div>

    <input type="file" id="file-wall" accept="image/*" style="display:none">
    <input type="file" id="file-img" accept="image/*" style="display:none">
    <canvas id="canvas-src" style="display:none"></canvas>
    <canvas id="canvas-work" style="display:none"></canvas>

<script>
const DESK = document.getElementById('desktop');
const TASK = document.getElementById('task-wins');
let zTop = 20, winSeq = 0, masterTick = 0;
let wallMode = 'term', mode = 'desktop';
let verbose = 1; // 0 high, 1 ticks, 2 all
const dbgBuf = [];
const probeLog = [];
const clipBank = []; // last 10 {t, kind, text?, url?}
const sockets = new Map(); // winId -> {ws, ka, dest}

const labState = {
    cols: 64, contrast: 1.0, bright: 0, color: false,
    osc: { contrast: false, cols: false }
};
const unicodeDB = [" ", "░", "▒", "▓", "█"];
const srcCanvas = document.getElementById('canvas-src');
const workCanvas = document.getElementById('canvas-work');
const wallLines = [];

function now() { return new Date().toISOString().slice(11,23); }

function dbg(level, src, msg) {
    const line = { t: now(), level, src, msg, tick: masterTick };
    dbgBuf.push(line);
    if (dbgBuf.length > 400) dbgBuf.shift();
    if (level <= verbose) paintDbg();
    if (level === 0) {
        wallLines.push(line.t + ' [' + src + '] ' + msg);
        if (wallLines.length > 80) wallLines.shift();
        if (wallMode === 'term') document.getElementById('wall-term').textContent = wallLines.join('\n');
    }
}
function paintDbg() {
    document.querySelectorAll('[data-dbg]').forEach(el => {
        el.innerHTML = dbgBuf.filter(x => x.level <= verbose).slice(-120).map(x =>
            `<span class="l${x.level}">${x.t} t${x.tick} L${x.level} ${x.src}  ${esc(x.msg)}</span>`
        ).join('\n');
        el.scrollTop = el.scrollHeight;
    });
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function masterPulse() {
    masterTick++;
    const led = document.getElementById('tick-led');
    led.classList.add('on');
    setTimeout(() => led.classList.remove('on'), 80);
    document.getElementById('tick-n').textContent = 't' + masterTick;
    dbg(1, 'OS', 'master tick');
    if (masterTick % 8 === 0) dbg(2, 'OS', 'osc phase ' + ((masterTick/8)%4));
}
setInterval(masterPulse, 1000);

function tickClock() {
    document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8);
}
setInterval(tickClock, 1000); tickClock();

/* load context — the map starts here */
const loadHow = {
    href: location.href,
    proto: location.protocol,
    host: location.host || '(none)',
    origin: location.origin,
    secure: location.protocol === 'https:',
    file: location.protocol === 'file:',
    mixedBlock: location.protocol === 'https:'
};
dbg(0, 'BOOT', 'loaded via ' + loadHow.proto + '  host=' + loadHow.host);
dbg(0, 'BOOT', 'secure=' + loadHow.secure + ' file=' + loadHow.file + ' mixed-block-ws=' + loadHow.mixedBlock);

document.querySelectorAll('.menu-root').forEach(root => {
    root.querySelector('.menu-btn').addEventListener('click', e => {
        e.stopPropagation();
        const open = root.classList.contains('open');
        closeMenus();
        if (!open) root.classList.add('open');
    });
});
document.addEventListener('click', closeMenus);
function closeMenus() {
    document.querySelectorAll('.menu-root').forEach(r => r.classList.remove('open'));
}
document.querySelectorAll('.menu-item[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        closeMenus();
        const map = {
            'new-term': () => launch('term'),
            'open-fm': () => launch('fm'),
            'open-launch': () => launch('launcher'),
            'open-lab': () => launch('lab'),
            'open-dbg': () => launch('dbg'),
            'open-clip': () => launch('clip'),
            'open-walls': () => launch('walls'),
            'open-map': () => launch('map'),
            'reset': resetLayout,
            'wall-term': () => setWall('term'),
            'wall-ascii': () => setWall('ascii'),
            'wall-solid': () => setWall('solid'),
            'wall-img': () => document.getElementById('file-wall').click(),
            'mode-desktop': () => setMode('desktop'),
            'mode-test': () => setMode('test'),
            'verb-0': () => { verbose = 0; dbg(0,'OPT','verbose=0'); paintDbg(); },
            'verb-1': () => { verbose = 1; dbg(0,'OPT','verbose=1'); paintDbg(); },
            'verb-2': () => { verbose = 2; dbg(0,'OPT','verbose=2'); paintDbg(); },
            'about': () => alert('SOVEREIGN SURFACE V2\nHTML-only. No raw TCP.\nTerminal = WS + same-origin probe + keepalive.\nClipboard bank = last 10 pastes.')
        };
        if (map[act]) map[act]();
    });
});

document.getElementById('file-wall').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    document.getElementById('wall-img').src = URL.createObjectURL(f);
    setWall('img');
});

function setWall(m) {
    wallMode = m;
    document.getElementById('wall-term').style.display = m === 'term' ? 'block' : 'none';
    document.getElementById('ascii-wallpaper').style.display = m === 'ascii' ? 'block' : 'none';
    document.getElementById('wall-img').style.display = m === 'img' ? 'block' : 'none';
    DESK.style.background = m === 'solid' ? '#020617' : '#000';
    dbg(0, 'VIEW', 'wallpaper=' + m);
}

function setMode(m) {
    mode = m;
    if (m === 'test') {
        document.querySelectorAll('.win').forEach(w => { if (w.dataset.kind !== 'lab') closeWin(w.id); });
        launch('lab'); setWall('ascii');
    }
    dbg(0, 'OPT', 'mode=' + m);
}

/* CLIPBOARD BANK */
document.addEventListener('paste', ev => {
    const items = ev.clipboardData ? [...ev.clipboardData.items] : [];
    let stored = false;
    for (const it of items) {
        if (it.type.startsWith('image/')) {
            const file = it.getAsFile();
            if (!file) continue;
            const url = URL.createObjectURL(file);
            pushClip({ kind: 'image', url, mime: it.type });
            stored = true;
        } else if (it.type === 'text/plain') {
            it.getAsString(s => pushClip({ kind: 'text', text: s }));
            stored = true;
        }
    }
    if (stored) dbg(0, 'CLIP', 'paste captured');
});
function pushClip(rec) {
    rec.t = now();
    clipBank.unshift(rec);
    while (clipBank.length > 10) {
        const dead = clipBank.pop();
        if (dead.url) URL.revokeObjectURL(dead.url);
    }
    paintClip();
}
function paintClip() {
    document.querySelectorAll('[data-clip]').forEach(el => {
        if (!clipBank.length) { el.innerHTML = '<div class="clip-meta">empty — paste anywhere</div>'; return; }
        el.innerHTML = clipBank.map((c,i) => {
            const body = c.kind === 'image'
                ? `<img src="${c.url}" alt="">`
                : `<div style="white-space:pre-wrap;max-height:72px;overflow:auto">${esc((c.text||'').slice(0,800))}</div>`;
            return `<div class="clip-item" data-i="${i}"><div class="clip-meta">${c.t}  ${c.kind}</div>${body}</div>`;
        }).join('');
        el.querySelectorAll('.clip-item').forEach(item => {
            item.onclick = () => {
                const c = clipBank[+item.dataset.i];
                if (c && c.text) navigator.clipboard.writeText(c.text).catch(()=>{});
                dbg(0,'CLIP','recall slot ' + item.dataset.i);
            };
        });
    });
}

/* WINDOWS */
function launch(kind) {
    if (kind === 'fm') spawnWin('fm', 'FILE MANAGER', 40, 40, 520, 300, fmHTML());
    if (kind === 'launcher') spawnWin('launcher', 'LAUNCHER', 80, 50, 360, 260, launchHTML());
    if (kind === 'term') spawnWin('term', 'TERMINAL', 100, 70, 560, 340, termHTML());
    if (kind === 'lab') spawnWin('lab', 'BITMATRIX LAB', 60, 40, 640, 360, labHTML());
    if (kind === 'dbg') spawnWin('dbg', 'DEBUG / TELEMETRY', 20, 200, 480, 220, `<div class="dbg" data-dbg></div>`);
    if (kind === 'clip') spawnWin('clip', 'CLIPBOARD BANK', 400, 200, 280, 280, `<div class="clip-list" data-clip></div>`);
    if (kind === 'walls') spawnWin('walls', 'HTML WALLS', 160, 40, 520, 320, wallsHTML());
    if (kind === 'map') spawnWin('map', 'CONNECT MAP', 180, 60, 560, 280, mapHTML());
    if (kind === 'dbg') paintDbg();
    if (kind === 'clip') paintClip();
    if (kind === 'map') paintMap();
}

function spawnWin(kind, title, x, y, w, h, bodyHTML) {
    const id = 'w' + (++winSeq);
    const el = document.createElement('div');
    el.className = 'win active';
    el.id = id;
    el.dataset.kind = kind;

function wireWin(el) {
    const title = el.querySelector('.win-title');
    const rz = el.querySelector('.win-resize');
    title.addEventListener('mousedown', e => {
        if (e.target.tagName === 'BUTTON') return;
        focusWin(el.id);
        const ox = e.clientX - el.offsetLeft, oy = e.clientY - el.offsetTop;
        const mv = ev => { el.style.left = Math.max(0, ev.clientX-ox)+'px'; el.style.top = Math.max(0, ev.clientY-oy)+'px'; };
        const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
    });
    rz.addEventListener('mousedown', e => {
        e.stopPropagation(); focusWin(el.id);
        const sx = e.clientX, sy = e.clientY, sw = el.offsetWidth, sh = el.offsetHeight;
        const mv = ev => { el.style.width = Math.max(240, sw+ev.clientX-sx)+'px'; el.style.height = Math.max(160, sh+ev.clientY-sy)+'px'; };
        const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
    });
    el.addEventListener('mousedown', () => focusWin(el.id));
}

function dropSock(id) {
    const s = sockets.get(id);
    if (!s) return;
    if (s.ka) clearInterval(s.ka);
    if (s.abort) try { s.abort.abort(); } catch(e) {}
    if (s.ws) try { s.ws.close(); } catch(e) {}
    sockets.delete(id);
}

    const log = win.querySelector('[data-log]');

function destOf(win) {
    const host = win.querySelector('[data-host]').value.trim();
    const port = win.querySelector('[data-port]').value.trim();
    const scheme = win.querySelector('[data-scheme]').value;
    const raw = (win.querySelector('[data-path]') && win.querySelector('[data-path]').value.trim()) || '/';
    const pth = raw.startsWith('/') ? raw : '/' + raw;
    const origin = host + (port ? ':' + port : '');
    return {
        host, port, scheme, path: pth,
        url: scheme + '://' + origin + ((scheme === 'ws' || scheme === 'wss') ? '/' : pth),
        httpUrl: ((scheme === 'https' || scheme === 'wss') ? 'https://' : 'http://') + origin + pth
    };
}

function hexSlice(u8, n) {
    return [...u8.slice(0, n)].map(b => b.toString(16).padStart(2,'0')).join(' ');
}
function parseWavHead(u8) {
    if (u8.length < 44) return null;
    const s = String.fromCharCode(...u8.slice(0,4));
    if (s !== 'RIFF') return null;
    const ch = u8[22] | (u8[23]<<8);
    const rate = u8[24] | (u8[25]<<8) | (u8[26]<<16) | (u8[27]<<24);
    const bits = u8[34] | (u8[35]<<8);
    return 'WAVE pcm  ch=' + ch + ' rate=' + rate + ' bits=' + bits;
}

async function sipHttp(win, print, setLed) {
    dropSock(win.id);
    const d = destOf(win);
    const url = d.httpUrl;
    if (loadHow.secure && url.startsWith('http://')) {
        print('[wall] https page cannot fetch http://  (mixed content)');
        addProbe('http-sip', url, 'blocked mixed-content');
        setLed('bad', 'mixed');
        return;
    }
    setLed('wait', 'sipping');
    print('[sip] GET ' + url);
    const ac = new AbortController();
    sockets.set(win.id, { abort: ac, dest: url });
    const t0 = Date.now();
    try {
        const r = await fetch(url, { signal: ac.signal, cache: 'no-store' });
        print('[sip] status ' + r.status + '  type=' + (r.headers.get('content-type')||'?') + '  te=' + (r.headers.get('transfer-encoding')||'-'));
        addProbe('http-sip', url, 'HTTP ' + r.status + ' ' + (r.headers.get('content-type')||''));
        if (!r.body) { print('[sip] no body'); setLed('bad','nobody'); return; }
        const reader = r.body.getReader();
        let got = 0, first = null;
        const budget = 8192;
        while (got < budget) {
            const { done, value } = await reader.read();
            if (done) break;
            if (!first) first = value;
            got += value.length;
        }
        try { await reader.cancel(); } catch(e) {}
        ac.abort();
        const ms = Date.now() - t0;
        print('[sip] bytes=' + got + ' in ' + ms + 'ms');
        if (first && first.length) {
            print('[sip] head ' + hexSlice(first, 16));
            const wav = parseWavHead(first);
            if (wav) print('[sip] ' + wav);
            else print('[sip] not wav header (ok — still sipped)');
        }
        print('[sip] cut after slice — streamer still live, we just proved ingress');
        setLed('ok', 'sipped ' + got);
        dbg(0, 'SIP', url + ' ' + got + 'b');
    } catch (e) {
        const msg = e.name === 'AbortError' ? 'aborted' : e.message;
        print('[sip] FAIL ' + msg);
        if (/Failed to fetch|NetworkError|CORS/i.test(msg)) {
            print('[wall] CORS or mixed. Streamer sent no Access-Control-Allow-Origin.');
            print('[wall] serve THIS html from that same host:port, or add ACAO * on Go.');
        }
        addProbe('http-sip', url, 'FAIL ' + msg);
        setLed('bad', 'fail');
    }
}

function connectWS(win, print, setLed) {
    dropSock(win.id);
    const d = destOf(win);
    if (loadHow.secure && d.scheme === 'ws') {
        print('[wall] https page + ws:// = mixed content. switch to wss.');
        addProbe('ws', d.url, 'blocked mixed-content (predicted)');
        setLed('bad', 'mixed');
        return;
    }
    if (loadHow.file) {
        print('[wall] file:// often cannot open WS. serve this HTML over http(s).');
        addProbe('ws', d.url, 'file:// likely blocked');
    }
    setLed('wait', 'connecting');
    print('[ws] ' + d.url);
    let ws;
    try { ws = new WebSocket(d.url); }
    catch (err) {
        print('[ws] construct fail ' + err.message);
        addProbe('ws', d.url, 'construct: ' + err.message);
        setLed('bad', 'fail');
        return;
    }
    const rec = { ws, ka: null, dest: d.url };
    sockets.set(win.id, rec);
    const t0 = Date.now();
    ws.onopen = () => {
        setLed('ok', 'up');
        print('[ws] open ' + (Date.now()-t0) + 'ms');
        addProbe('ws', d.url, 'OPEN');
        rec.ka = setInterval(() => {
            if (ws.readyState === 1) {
                try { ws.send(JSON.stringify({ t: 'ka', tick: masterTick })); } catch(e) {}
                dbg(2, 'KA', d.url);
            }
        }, 5000);
    };
    ws.onmessage = ev => {
        print(typeof ev.data === 'string' ? ev.data : ('[bin ' + ev.data.size + ']'));
        dbg(2, 'TERM', 'rx');
    };
    ws.onerror = () => {
        print('[ws] error (browser hides detail)');
        addProbe('ws', d.url, 'ERROR');
        setLed('bad', 'err');
    };
    ws.onclose = ev => {
        print('[ws] close code=' + ev.code + ' ' + (ev.reason||''));
        addProbe('ws', d.url, 'CLOSE ' + ev.code);
        if (rec.ka) clearInterval(rec.ka);
        sockets.delete(win.id);
        setLed('', 'idle');
    };
}

async function runProbe(win, print) {
    const d = destOf(win);
    print('[probe] origin=' + loadHow.origin);
    print('[probe] target ' + d.url);

    /* same-origin fetch — only meaningful if we were served by that host */
    try {
        const r = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
        addProbe('fetch-self', location.href, r.status + ' ' + r.type);
        print('[probe] self HEAD ' + r.status);
    } catch (e) {
        addProbe('fetch-self', location.href, String(e.message));
        print('[probe] self HEAD fail ' + e.message);
    }

    const httpUrl = d.httpUrl;
    try {
        const r = await fetch(httpUrl, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
        addProbe('fetch-dest no-cors', httpUrl, 'opaque/' + r.type + ' (no status — CORS wall)');
        print('[probe] dest fetch opaque (CORS hides status). not proof of PTY.');
    } catch (e) {
        addProbe('fetch-dest', httpUrl, e.message);
        print('[probe] dest fetch fail ' + e.message);
    }
    print('[probe] next: Connect. If OPEN, you have a WS peer. Still not a shell until that peer is a PTY bridge.');
}

function loadPresetGradient() {

    srcCanvas.width = 100; srcCanvas.height = 100;

document.getElementById('file-img').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const img = new Image();
        img.onload = () => {

function renderLab(time) {
    let cols = labState.cols, contrast = labState.contrast;
    if (labState.osc.contrast) contrast += Math.sin(time/500)*0.5;
    if (labState.osc.cols) cols = Math.max(16, labState.cols + Math.round(Math.sin(time/700)*12));
    const asciiEl = document.getElementById('ascii-output');
    const wallAscii = document.getElementById('ascii-wallpaper');
    if (srcCanvas.width > 0) {
        const aspect = srcCanvas.height / srcCanvas.width;
        const rows = Math.round(cols * aspect * 0.55);
        workCanvas.width = cols; workCanvas.height = rows;
        const ctx = workCanvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(srcCanvas, 0, 0, cols, rows);
        const imgData = ctx.getImageData(0,0,cols,rows).data;
        let out = '', plain = '';
        for (let y=0;y<rows;y++) {
            for (let x=0;x<cols;x++) {
                const i = (y*cols+x)*4;
                const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
                let gray = r*0.299 + g*0.587 + b*0.114;
                gray = ((gray-128)*contrast)+128+labState.bright;
                gray = Math.max(0, Math.min(255, gray));
                const ch = unicodeDB[Math.floor((gray/255)*(unicodeDB.length-1))];
                if (labState.color) out += `<span style="color:rgb(${r},${g},${b})">${ch}</span>`;
                else out += ch;
                plain += ch;
            }
            out += '\n'; plain += '\n';
        }
        if (asciiEl) { if (labState.color) asciiEl.innerHTML = out; else asciiEl.innerText = out; }
        if (wallMode === 'ascii' && wallAscii) wallAscii.textContent = plain;
    }
    requestAnimationFrame(renderLab);
}
